<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelFinder - Book Your Perfect Stay</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <style>
        .price-slider .ui-slider-handle {
            width: 20px;
            height: 20px;
            top: -8px;
            border-radius: 50%;
        }

        .hotel-card {
            transition: transform 0.2s;
        }

        .hotel-card:hover {
            transform: translateY(-5px);
        }

        .navbar {
            background-color: #003580;
        }

        .search-container {
            margin-top: -40px;
            position: relative;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="#">TravelFinder</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3">Sign in</span>
                <span>Register</span>
            </div>
        </div>
    </nav>

    <!-- Search Form -->
    <div class="container search-container">
        <div class="card shadow-lg">
            <div class="card-body">
                <form id="searchForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text" class="form-control" placeholder="Destination">
                        </div>
                        <div class="col-md-2">
                            <input type="text" class="form-control datepicker" id="checkin" placeholder="Check-in">
                        </div>
                        <div class="col-md-2">
                            <input type="text" class="form-control datepicker" id="checkout" placeholder="Check-out">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select">
                                <option>1 Adult</option>
                                <option>2 Adults</option>
                                <option>3 Adults</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary w-100">Search</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row g-4">
            <!-- Filters -->
            <div class="col-lg-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Filters</h5>
                        
                        <div class="mb-4">
                            <h6 class="fw-bold mb-3">Price Range</h6>
                            <div id="price-slider" class="price-slider"></div>
                            <div id="price-values" class="mt-2 text-muted small"></div>
                        </div>

                        <div class="mb-4">
                            <h6 class="fw-bold mb-3">Star Rating</h6>
                            <div class="form-check">
                                <input class="form-check-input star-rating" type="checkbox" value="5" id="rating5">
                                <label class="form-check-label" for="rating5">★★★★★</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input star-rating" type="checkbox" value="4" id="rating4">
                                <label class="form-check-label" for="rating4">★★★★</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input star-rating" type="checkbox" value="3" id="rating3">
                                <label class="form-check-label" for="rating3">★★★</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h6 class="fw-bold mb-3">Amenities</h6>
                            <div class="form-check">
                                <input class="form-check-input amenity" type="checkbox" value="wifi" id="wifi">
                                <label class="form-check-label" for="wifi">Free WiFi</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input amenity" type="checkbox" value="pool" id="pool">
                                <label class="form-check-label" for="pool">Swimming Pool</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input amenity" type="checkbox" value="parking" id="parking">
                                <label class="form-check-label" for="parking">Free Parking</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="col-lg-9">
                <div class="row g-4">
                    <!-- Hotel Card -->
                    <div class="col-12 hotel-card" data-price="150" data-rating="4" data-amenities="wifi pool">
                        <div class="card shadow-sm h-100">
                            <div class="row g-0">
                                <div class="col-md-4">
                                    <img src="https://via.placeholder.com/300x200" class="img-fluid rounded-start" alt="Hotel">
                                </div>
                                <div class="col-md-8">
                                    <div class="card-body d-flex flex-column h-100">
                                        <div class="d-flex justify-content-between">
                                            <h5 class="card-title">Luxury Resort & Spa</h5>
                                            <span class="text-primary fs-5">$150/night</span>
                                        </div>
                                        <div class="mb-2 text-warning">★★★★</div>
                                        <ul class="list-inline mb-3">
                                            <li class="list-inline-item"><i class="bi bi-wifi"></i> Free WiFi</li>
                                            <li class="list-inline-item"><i class="bi bi-water"></i> Pool</li>
                                        </ul>
                                        <button class="btn btn-primary mt-auto align-self-start">View Deal</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- More hotel cards can be added here -->
                </div>
            </div>
        </div>
    </div>



    <!-- Add this modal HTML before the scripts section -->
<div class="modal fade" id="hotelModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="hotelName"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="hotelCarousel" class="carousel slide mb-4">
                    <div class="carousel-inner">
                        <!-- Carousel items will be added dynamically -->
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#hotelCarousel">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#hotelCarousel">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
                
                <div class="row">
                    <div class="col-md-8">
                        <h4>Details</h4>
                        <div class="d-flex justify-content-between mb-3">
                            <div>
                                <span class="text-primary fs-4" id="hotelPrice"></span>/night
                                <div class="text-warning" id="hotelRating"></div>
                            </div>
                            <div id="hotelAmenities"></div>
                        </div>
                        <p>A luxurious resort offering premium amenities and exceptional service. Perfect for both leisure and business travelers.</p>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Book Your Stay</h5>
                                <div class="mb-3">
                                    <label class="form-label">Check-in Date</label>
                                    <input type="date" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Check-out Date</label>
                                    <input type="date" class="form-control">
                                </div>
                                <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#registerModal">
                                    Book Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Registration Modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="registrationForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register & Book</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Add this script modification -->
<script>
// Update the existing script with these modifications
$(function() {
    // ... existing code ...

    // View Deal click handler
    $('.hotel-card').on('click', '.btn-primary', function() {
        const card = $(this).closest('.hotel-card');
        const hotelName = card.find('.card-title').text();
        const price = card.data('price');
        const rating = card.data('rating');
        const amenities = card.data('amenities').split(' ');

        // Set modal content
        $('#hotelName').text(hotelName);
        $('#hotelPrice').text('$' + price);
        $('#hotelRating').html('★'.repeat(rating));
        
        // Set amenities
        const amenitiesHtml = amenities.map(a => 
            `<span class="badge bg-primary me-1">${a}</span>`
        ).join('');
        $('#hotelAmenities').html(amenitiesHtml);

        // Set carousel images (using placeholder, replace with actual images)
        const carouselInner = $('#hotelCarousel .carousel-inner');
        carouselInner.empty();
        for(let i = 0; i < 3; i++) {
            carouselInner.append(`
                <div class="carousel-item ${i === 0 ? 'active' : ''}">
                    <img src="https://via.placeholder.com/800x400" class="d-block w-100">
                </div>
            `);
        }

        // Show modal
        new bootstrap.Modal(document.getElementById('hotelModal')).show();
    });

    // Registration form submission
    $('#registrationForm').submit(function(e) {
        e.preventDefault();
        alert('Registration successful! Redirecting to payment...');
        $('#registerModal').modal('hide');
        $('#hotelModal').modal('hide');
    });
});
</script>

<!-- Add this CSS -->
<style>
.carousel-item img {
    height: 400px;
    object-fit: cover;
}

.modal-body .card {
    position: sticky;
    top: 20px;
}

.badge {
    text-transform: capitalize;
}

@media (max-width: 768px) {
    .carousel-item img {
        height: 200px;
    }
    
    .modal-body .card {
        position: static;
        margin-top: 20px;
    }
}
</style>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(function() {
            // Datepicker initialization
            $(".datepicker").datepicker({
                minDate: 0,
                dateFormat: 'yy-mm-dd'
            });

            // Price range slider
            $("#price-slider").slider({
                range: true,
                min: 0,
                max: 500,
                values: [100, 300],
                slide: function(event, ui) {
                    $("#price-values").text("$" + ui.values[0] + " - $" + ui.values[1]);
                    filterResults();
                }
            });
            $("#price-values").text("$" + $("#price-slider").slider("values", 0) + " - $" + 
                                  $("#price-slider").slider("values", 1));

            // Filter handling
            $(".star-rating, .amenity").change(filterResults);

            function filterResults() {
                const minPrice = $("#price-slider").slider("values", 0);
                const maxPrice = $("#price-slider").slider("values", 1);
                const selectedStars = $(".star-rating:checked").map(function() {
                    return parseInt($(this).val());
                }).get();
                const selectedAmenities = $(".amenity:checked").map(function() {
                    return $(this).val();
                }).get();

                $(".hotel-card").each(function() {
                    const price = parseInt($(this).data("price"));
                    const rating = parseInt($(this).data("rating"));
                    const amenities = $(this).data("amenities").split(" ");

                    const priceMatch = price >= minPrice && price <= maxPrice;
                    const ratingMatch = selectedStars.length === 0 || selectedStars.includes(rating);
                    const amenitiesMatch = selectedAmenities.every(a => amenities.includes(a));

                    $(this).toggle(priceMatch && ratingMatch && amenitiesMatch);
                });
            }

            // Form submission
            $("#searchForm").submit(function(e) {
                e.preventDefault();
                // Add search functionality here
                alert("Search functionality would go here");
            });
        });
    </script>
</body>
</html>
